<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランナーズガイド</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:sans-serif;
background:#111;
color:white;
}

.hero{
height:60vh;
background:
linear-gradient(
rgba(0,0,0,.4),
rgba(0,0,0,.7)
),
url("runner.png");
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
},
url("https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=1200");
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:3rem;
margin-bottom:10px;
}

.hero p{
font-size:1.2rem;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1f1f1f;
border-radius:15px;
padding:25px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
margin-bottom:10px;
color:#ff7b00;
}

.btn{
display:inline-block;
margin-top:15px;
padding:10px 15px;
background:#ff7b00;
color:white;
text-decoration:none;
border-radius:8px;
}

footer{
text-align:center;
padding:30px;
color:#aaa;
}

</style>
</head>

<body>

<section class="hero">
<h1>🏃 Runner's Guide</h1>
<p>初心者からサブ3までのランナーをサポート</p>
</section>

<div class="container">

<div class="cards">

<div class="card">
<h2>👟 おすすめシューズ</h2>
<p>レベル別おすすめシューズを紹介。</p>
<a class="btn" href="shoes.html">見る</a>
</div>

<div class="card">
<h2>📅 練習メニュー</h2>
<p>完走・サブ5・サブ4向け。</p>
<a class="btn" href="training.html">見る</a>
</div>

<div class="card">
<h2>⏱ レース予測ツール</h2>
<p>フルマラソン予想タイムを計算。</p>
<a class="btn" href="race.html">使う</a>
</div>

</div>

</div>

<footer>
© Runner's Guide
</footer>

</body>
</html>
