<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner's Guide</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Noto Sans JP',sans-serif;
background:#111;
color:white;
}

.hero{
height:70vh;
background:
linear-gradient(
rgba(0,0,0,.4),
rgba(0,0,0,.7)
),
url("runner.png");
background-size:cover;
background-position:center;

display:flex;
flex-direction:column;
justify-content:center;
align-items:flex-start;

text-align:left;

padding-left:10%;
padding-right:20px;
}

.hero h1{
font-size:3.2rem;
font-weight:900;
line-height:1.05;
letter-spacing:-2px;
margin-bottom:20px;
text-shadow:0 5px 20px rgba(0,0,0,.5);
max-width:none;
}

.hero p{
font-size:1.1rem;
line-height:1.8;
font-weight:300;
}

.line{
width:90px;
height:4px;
background:#ff7b00;
margin:20px 0;
}

.brand{
margin-top:30px;
font-size:0.9rem;
letter-spacing:6px;
font-weight:700;
opacity:0.8;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1f1f1f;
border-radius:15px;
padding:25px;
transition:.3s;
}

.card-img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
margin-bottom:15px;
opacity:0.9;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
margin-bottom:10px;
color:#ff7b00;
}

.btn{
display:inline-block;
margin-top:15px;
padding:10px 15px;
background:#ff7b00;
color:white;
text-decoration:none;
border-radius:8px;
}

footer{
text-align:center;
padding:30px;
color:#aaa;
}

</style>
</head>

<body>

<section class="hero">

<h1>
42.195kmの物語に<br>
あなたの彩りを
</h1>

<div class="line"></div>

<p>
初心者からサブ3まで。<br>
すべての市民ランナーのために。
</p>

<div class="brand">
RUNNER'S GUIDE
</div>

</section>


<div class="container">

<div class="card">

<img src="shoe.png" class="card-img">

<h2>推奨シューズ</h2>

<p>
レベル別おすすめシューズを紹介。
</p>

<a class="btn" href="shoes.html">見る</a>

</div>

<div class="card">
<h2>📅 練習メニュー</h2>
<p>完走・サブ5・サブ4向け。</p>
<a class="btn" href="training.html">見る</a>
</div>

<div class="card">
<h2>⏱ レース予測ツール</h2>
<p>フルマラソン予想タイムを計算。</p>
<a class="btn" href="race.html">使う</a>
</div>

</div>

</div>

<footer>
© Runner's Guide
</footer>

</body>
</html>
